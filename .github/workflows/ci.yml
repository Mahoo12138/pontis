name: CI

# 阶段 A 要求的是"可复现的开发环境 + 基础 CI"。这里跑的正是根命令，
# 所以本地 `pnpm test` 与 CI 不会各自漂移。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 版本以 server/go.mod 为准，避免这里和模块指令各说一套。
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # 同步、备份、任务队列的契约里有并发；不带 -race 的绿灯说明不了
      # 这些边界（doc 21、评审 R11/R12）。
      - name: test (race)
        run: go test -race ./...

  client:
    name: Web, extension and protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      - name: web build
        run: pnpm build:web
      - name: extension build
        run: pnpm --filter @pontis/extension build

  # 阶段 F 的出口条件是"下载一个产物、指定数据目录即可运行"，所以这里
  # 检查的正是那个产物本身，而不是它的源。
  release:
    name: Single-binary artifact
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build (web -> stage -> embed -> go build)
        run: pnpm build
      - name: run the binary with no toolchain in its environment
        run: |
          set -eu
          # env -i 之后进程没有 PATH，也就接触不到 Node：产物必须自己就能跑。
          env -i PONTIS_DATA_DIR="$PWD/run-data" PONTIS_LISTEN=127.0.0.1:8080 \
            PONTIS_LOG_LEVEL=warn ./server/pontis -config no-such-file.toml > server.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8080/healthz > /dev/null || { cat server.log; exit 1; }

          # SPA 深链：直接刷新一个前端路由要拿到应用外壳，而不是 404。
          curl -sf http://127.0.0.1:8080/spaces/0198c0de-7000-7000-8000-000000000020/explorer \
            | grep -q 'id="root"'

          # 未知 API 路由必须是 API 错误，不能回退成 index.html。
          code=$(curl -s -o api-404.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/definitely-not-a-route)
          test "$code" = 404
          grep -q ROUTE_NOT_FOUND api-404.json
          ct=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/api/v1/definitely-not-a-route)
          test "$ct" = "application/json"

          # 全新实例在产物里能完成初始化：setup -> login -> 建 Space。
          curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password","email":"ci@example.com"}' > /dev/null
          token=$(curl -sf -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -sf -X POST http://127.0.0.1:8080/api/v1/spaces \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"CI"}' | grep -q '"name":"CI"'
          kill %1

